<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A little surprise for you ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;color:#fff2f5;font-family:Georgia,serif;background:radial-gradient(circle at 20% 15%,#77334e 0,transparent 34%),radial-gradient(circle at 85% 80%,#49223f 0,transparent 38%),linear-gradient(135deg,#160d19,#321323 55%,#170d1b)}
.card{width:min(100%,440px);padding:40px 28px;text-align:center;border:1px solid #ffbed044;border-radius:28px;background:#ffffff12;box-shadow:0 24px 80px #0006}
.tiny{color:#ffadc2;letter-spacing:4px;text-transform:uppercase;font:11px Arial,sans-serif}
h1{font-size:clamp(29px,7vw,38px);line-height:1.15;margin:18px 0 12px;font-weight:500}
p{color:#e9cbd5;line-height:1.7;font:14px/1.7 Arial,sans-serif}
input{width:100%;margin:20px 0 12px;padding:15px;border-radius:13px;border:1px solid #ffbed066;background:#14081180;color:white;text-align:center;font-size:18px;letter-spacing:2px;outline:none}
button{width:100%;padding:15px;border:0;border-radius:13px;cursor:pointer;background:linear-gradient(100deg,#ff9bb5,#e96b91);color:#351321;font-weight:bold;font-size:15px}
#error{min-height:20px;color:#ffadc2;font:12px Arial,sans-serif;margin-top:10px}
#reveal{display:none}
.big-heart{font-size:48px;margin:12px 0;color:#ff9eb9}
.message{font-size:clamp(27px,7vw,39px);color:#ffd2de;line-height:1.35;margin:15px 0}
.signature{color:#ff9eb9;font-style:italic;font-size:18px}
</style>
</head>
<body>
<main class="card">
  <section id="lock">
    <div class="tiny">just for you · ♡</div>
    <h1>A little surprise<br>is waiting...</h1>
    <p>There’s a tiny secret behind this door.<br>Enter the password to open it.</p>
    <form id="unlockForm">
      <input id="password" type="password" inputmode="numeric" placeholder="Enter the secret password" autocomplete="off" aria-label="Password">
      <button type="submit">Unlock my surprise ♡</button>
    </form>
    <div id="error" role="status"></div>
  </section>
  <section id="reveal">
    <div class="tiny">the secret is...</div>
    <div class="big-heart">♥</div>
    <div class="message">Mohamed loves you<br>ya hob hayatiiiii</div>
    <div class="signature">More than words can say ♡</div>
    <p>You’re my favorite person, my sweetest thought, and the reason behind this little smile.</p>
  </section>
</main>
<script>
(function () {
  const correctPassword = "13092026";
  const form = document.getElementById("unlockForm");
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    const enteredPassword = document.getElementById("password").value.trim();
    if (enteredPassword === correctPassword) {
      document.getElementById("lock").style.display = "none";
      document.getElementById("reveal").style.display = "block";
    } else {
      document.getElementById("error").textContent = "Try again, my love ♡";
    }
  });
})();
</script>
</body>
</html>
